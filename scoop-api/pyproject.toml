[project]
name = "scoop-api"
version = "0.1.0"
description = "Scoop API service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.12.1",
    "duckdb>=1.5.6",
    "fastapi[standard]>=0.142.4",
    "psycopg[binary]>=3.2",
    "pydantic",
    "pymysql>=1.1",
]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.83.0",
    "pytest",
    "ruff>=0.16.10",
    "testcontainers[mysql,postgres]>=4",
]

[tool.datamodel-codegen]
input = "../scoop-types/build/@typespec/openapi3/openapi.yaml"
input-file-type = "openapi"
output = "models.py"
output-model-type = "pydantic_v2.BaseModel"
target-python-version = "3.11"
snake-case-field = true
field-constraints = true
capitalize-enum-members = true
allow-extra-fields = true
# Plain unions, not RootModel wrappers: children are the node classes themselves
use-type-alias = true
# Single-value enums (discriminator tags) become Literal, defaulted so nodes
# can be built without passing `kind`
enum-field-as-literal = "one"
use-one-literal-as-default = true
# Construct with Python names for keyword fields, e.g. CaseExpr(else_=...)
allow-population-by-field-name = true

[tool.pytest.ini_options]
markers = [
    "integration: end-to-end HTTP tests against every connector backend (starts Docker containers)",
    "live: calls the Claude API (needs ANTHROPIC_API_KEY)",
]
